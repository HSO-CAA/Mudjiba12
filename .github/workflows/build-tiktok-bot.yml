name: Build TikTok Bot (exe)

on:
  workflow_dispatch:
  push:
    paths:
      - "tiktok_bot/**"
      - ".github/workflows/build-tiktok-bot.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tiktok_bot/requirements.txt pyinstaller

      - name: Build exe
        working-directory: tiktok_bot
        run: pyinstaller --onefile --windowed --name TikTokBot app.py

      - name: Smoke test (window opens and stays up)
        working-directory: tiktok_bot
        shell: pwsh
        run: |
          $p = Start-Process .\dist\TikTokBot.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item tiktok_bot/dist/TikTokBot.exe out/
          Copy-Item tiktok_bot/README.md out/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokBot-windows
          path: out/
