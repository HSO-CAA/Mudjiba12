name: Build TikTok Bot (exe)

on:
  workflow_dispatch:
  push:
    paths:
      - "tiktok_bot/**"
      - ".github/workflows/build-tiktok-bot.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tiktok_bot/requirements.txt pyinstaller

      - name: Build exe
        working-directory: tiktok_bot
        run: pyinstaller --onefile --windowed --name TikTokBot --add-data "ui.html;." app.py

      - name: Smoke test (exe opens the interface)
        working-directory: tiktok_bot
        shell: pwsh
        run: |
          $p = Start-Process .\dist\TikTokBot.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "exe exited early with code $($p.ExitCode)"; exit 1 }
          $cmd = (Get-CimInstance Win32_Process -Filter "name='msedge.exe'").CommandLine -join "`n"
          if ($cmd -notmatch '--app=(http://127\.0\.0\.1:\d+/)') { Write-Error "Edge window was not opened"; exit 1 }
          $page = Invoke-WebRequest -UseBasicParsing $Matches[1]
          if ($page.Content -notmatch 'TikTok') { Write-Error "UI page not served"; exit 1 }
          Write-Output "UI served at $($Matches[1])"
          Stop-Process -Id $p.Id -Force
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item tiktok_bot/dist/TikTokBot.exe out/
          Copy-Item tiktok_bot/README.md out/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokBot-windows
          path: out/
