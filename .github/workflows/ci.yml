name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: s5y
          POSTGRES_PASSWORD: s5y
          POSTGRES_DB: s5y_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s5y -d s5y_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The API tests truncate every table, so they only ever use TEST_DATABASE_URL (and refuse to run
      # when DATABASE_URL points to the same database). They apply the migrations themselves.
      TEST_DATABASE_URL: postgresql://s5y:s5y@localhost:5432/s5y_test?schema=public
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Migrations match schema.prisma
        working-directory: apps/api
        run: |
          echo 'CREATE DATABASE s5y_shadow;' | npx prisma db execute --stdin --url "$TEST_DATABASE_URL"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://s5y:s5y@localhost:5432/s5y_shadow" \
            --exit-code \
            || { echo "::error::schema.prisma has changes without a migration — run 'npm run db:migrate' and commit prisma/migrations"; exit 1; }

      - name: Test (API)
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    env:
      SMOKE_BASE_URL: http://localhost:4000
      SMOKE_ADMIN_PATH: /studio-ci
      SMOKE_EMAIL: owner@ci.test
      SMOKE_PASSWORD: Ci-Owner-Pass-2026
      SMOKE_STATE: ${{ github.workspace }}/smoke-state.json
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: s5y-portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker image ls s5y-portfolio:latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg (makes the smoke-test media)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Start the stack (docker compose)
        run: |
          cat > ci.env <<EOF
          POSTGRES_PASSWORD=ci-db-password-2026
          PUBLIC_URL=http://localhost:4000
          ADMIN_PATH=$SMOKE_ADMIN_PATH
          ADMIN_EMAIL=$SMOKE_EMAIL
          ADMIN_PASSWORD=$SMOKE_PASSWORD
          COOKIE_SECURE=false
          EOF
          docker compose --env-file ci.env up -d --no-build --wait --wait-timeout 240
          docker compose --env-file ci.env logs --no-color --tail 40 app

      - name: Smoke test (site, admin, login, image + chunked HEVC video upload → READY)
        run: node deploy/smoke-test.mjs

      - name: Container checks (non-root, ffmpeg, create-admin)
        run: |
          uid=$(docker compose --env-file ci.env exec -T app id -u)
          echo "app runs as uid $uid"; test "$uid" != "0"
          docker compose --env-file ci.env exec -T app ffmpeg -hide_banner -version
          docker compose --env-file ci.env exec -T app node dist/scripts/create-admin.js --email "$SMOKE_EMAIL" --password Ci-Reset-Pass-2026

      - name: Media survives a restart
        env:
          SMOKE_PASSWORD: Ci-Reset-Pass-2026
        run: |
          docker compose --env-file ci.env restart app
          node deploy/smoke-test.mjs --recheck

      - name: Logs
        if: failure()
        run: docker compose --env-file ci.env logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --env-file ci.env down -v || true
